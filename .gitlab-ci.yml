stages:
  - test

default:
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-gi-cairo gir1.2-gtk-3.0
    - scripts/install.sh

test0-job:
  stage: test
  script:
    - gtkhafiz --version | grep version

test1-job:
  stage: test
  script:
    - gtkhafiz -v | grep version
