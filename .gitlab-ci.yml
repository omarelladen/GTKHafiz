stages:
  - test

default:
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-gi-cairo gir1.2-gtk-3.0
    - scripts/install.sh

test1-job:
  stage: test
  script:
    - gtkhafiz --version | grep GTKHafiz

test2-job:
  stage: test
  script:
    - gtkhafiz -v | grep GTKHafiz

lint1-job:
  stage: test
  script:
    - |
      grep -Rn '[ ]$' src/ scripts/
      if [ $? -eq 0 ]; then
          echo "Found trailing whitespaces!"
          exit 1
      fi
      exit 0
