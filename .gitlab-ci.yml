stages:
  - test

default:
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-gi-cairo gir1.2-gtk-3.0
    - scripts/install.sh

test1-job:
  stage: test
  script:
    - gtkhafiz --help

test2-job:
  stage: test
  script:
    - gtkhafiz -h

test3-job:
  stage: test
  script:
    - gtkhafiz --version | grep GTKHafiz

test4-job:
  stage: test
  script:
    - gtkhafiz -v | grep GTKHafiz
